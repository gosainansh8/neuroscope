[project]
name = "neuroscope"
version = "0.1.0"
description = "Sourced neuroscience drug-development intelligence"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["neuroscope"]

[tool.setuptools.package-data]
neuroscope = ["static/*.html"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
vertex = ["google-genai>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
testpaths = ["tests"]
