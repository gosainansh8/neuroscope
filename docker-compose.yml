# Local Postgres 16 with pgvector. Matches what Cloud SQL will run later.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neuroscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql:ro

volumes:
  pgdata:
